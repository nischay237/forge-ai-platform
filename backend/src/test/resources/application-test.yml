spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:forgetest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: forge
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

management:
  health:
    redis:
      enabled: false
  otlp:
    tracing:
      export:
        enabled: false

forge:
  security:
    jwt-secret: test-only-jwt-signing-secret-with-more-than-64-characters-entropy-2026!
    jwt-expiration-ms: 900000
    refresh-expiration-ms: 604800000
    encryption-key: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
    encryption-key-id: k1
  webhooks:
    allow-inline-diff: true
  seed:
    enabled: false
  outbox:
    poll-interval-ms: 60000
