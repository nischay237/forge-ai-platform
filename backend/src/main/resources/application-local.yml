spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/forge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: forge
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
  otlp:
    tracing:
      export:
        enabled: false

forge:
  security:
    jwt-secret: ${FORGE_JWT_SECRET:local-dev-only-jwt-signing-key-minimum-64-bytes-length-not-for-prod!}
    jwt-expiration-ms: ${FORGE_JWT_EXPIRATION_MS:3600000}
    encryption-key: ${FORGE_ENCRYPTION_KEY:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=}
  webhooks:
    allow-inline-diff: true
  seed:
    enabled: false
