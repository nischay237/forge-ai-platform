name: FORGE CI Pipeline

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-hygiene:
    name: Security & Config Hygiene Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no hardcoded demo credentials or dev defaults in prod/docs/frontend
        run: |
          if grep -rnE "ForgeUser@2026|forge-local-webhook-secret" README.md docs/ render.yaml docker-compose.yml backend/src/main/resources/application-prod.yml frontend/src/pages/; then
            echo "ERROR: Found hardcoded demo credential or dev secret in production/docs/UI files."
            exit 1
          fi
          if grep -rnE "forge_dev_password|forge-dev-only" render.yaml docker-compose.yml backend/src/main/resources/application-prod.yml; then
            echo "ERROR: Found hardcoded dev secret in deployment/prod configuration."
            exit 1
          fi
          echo "Security hygiene checks passed."

  backend-verify:
    name: Backend (Java 21 + Spring Boot + ArchUnit + Postgres Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit, security, multi-tenant & ArchUnit tests
        run: chmod +x mvnw && ./mvnw test --no-transfer-progress
      - name: Run PostgreSQL 16 Flyway V1-V6 Testcontainers integration test
        run: ./mvnw test -Dtest=PostgresMigrationContainersIT --no-transfer-progress

  frontend-verify:
    name: Frontend (React + TypeScript + Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Run Vitest unit & security tests
        run: npm run test
      - name: Production Vite build
        run: npm run build
