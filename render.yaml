services:
  - type: web
    name: forge-ai-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FORGE_SEED_ENABLED
        value: "false"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: FORGE_JWT_SECRET
        sync: false
      - key: FORGE_ENCRYPTION_KEY
        sync: false
      - key: FORGE_ENCRYPTION_KEY_ID
        value: k1
      - key: FORGE_CORS_ORIGINS
        sync: false
